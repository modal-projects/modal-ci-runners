[project]
name = "runner-modal"
version = "0.1.0"
description = "CI runners on Modal — Runner.create registers a webhook Server; Job.create runs job Sandboxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "modal>=1.5.2,<2",
    "pydantic>=2.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.0",
    "ruff>=0.15.21",
]

[tool.pyright]
include = ["src/runner_modal"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# Modal's public stubs use Unknown in several decorators / Image helpers.
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src/runner_modal", "examples", "tests"]
